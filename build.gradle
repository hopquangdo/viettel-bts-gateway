plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'vn.edu.huce.iic'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

repositories {
	mavenCentral()
}

ext {
	// Train Spring Cloud dành cho Spring Boot 4.0.x
	springCloudVersion = '2025.1.3'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

dependencies {
	// Gateway chạy trên WebFlux (Netty). KHÔNG thêm spring-boot-starter-webmvc vào module này.
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Verify JWT HS256 (cùng khóa JWT_SECRET với backend)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootRun') {
	def dotEnv = file('.env')
	if (dotEnv.exists()) {
		dotEnv.eachLine { line ->
			def trimmed = line.trim()
			if (!trimmed.isEmpty() && !trimmed.startsWith('#') && trimmed.contains('=')) {
				def idx = trimmed.indexOf('=')
				environment trimmed.substring(0, idx).trim(), trimmed.substring(idx + 1).trim()
			}
		}
	}
}
