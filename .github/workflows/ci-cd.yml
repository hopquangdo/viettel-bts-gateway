# CI/CD: test (nhánh dev + main) -> build image (chỉ main) -> deploy lên k3s (chỉ main).
#
# Secrets cần có ở repo này (Settings > Secrets and variables > Actions, environment "production"):
#   SSH_HOST, SSH_PORT (mặc định 22), SSH_USER, SSH_PRIVATE_KEY   vào server chạy k3s
#   KUBE_NAMESPACE                                                (tùy chọn) mặc định viettel-prod
#   GHCR_USERNAME, GHCR_TOKEN                                     (tùy chọn) PAT push+pull (write:packages + read:packages); nếu có sẽ dùng
#                                                                 thay GITHUB_TOKEN để đẩy image (cần khi package chưa gắn với repo)
#
# Image chỉ đẩy lên ghcr.io bằng GITHUB_TOKEN. Deploy = `kubectl set image` đúng tag sha-xxxxxxx vừa build; lỗi
# rollout thì tự `rollout undo`. Lần đầu (chưa có Deployment) chạy scripts/apply.sh (repo viettel-vtk-deploy) trên server.

name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# Không hủy lần chạy đang deploy ở main.
concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DEPLOYMENT: gateway

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew && ./gradlew test --no-daemon

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    timeout-minutes: 30
    outputs:
      # Chỉ truyền tag: GitHub loại bỏ job output nếu nó chứa chuỗi trùng giá trị một secret (tên image chứa tên tài khoản).
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # Có GHCR_TOKEN (+ GHCR_USERNAME) thì dùng; không thì dùng GITHUB_TOKEN của workflow.
          username: ${{ (secrets.GHCR_TOKEN != '' && secrets.GHCR_USERNAME) || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Resolve image
        id: meta
        run: |
          IMAGE="${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/viettel-gateway"
          TAG="sha-${GITHUB_SHA::7}"
          echo "ref=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - name: Publish image reference
        run: |
          echo "### Image đã build" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    concurrency:
      group: k8s-deploy-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: Resolve image reference
        id: img
        run: |
          IMAGE="${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/viettel-gateway"
          echo "ref=${IMAGE}:${{ needs.build.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Set image and wait for rollout
        uses: appleboy/ssh-action@v1.2.0
        env:
          NS: ${{ secrets.KUBE_NAMESPACE || 'viettel-prod' }}
          IMAGE: ${{ steps.img.outputs.ref }}
          DEPLOYMENT: ${{ env.DEPLOYMENT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: NS,IMAGE,DEPLOYMENT
          script_stop: true
          script: |
            set -euo pipefail
            [ -n "${NS:-}" ] && [ -n "${IMAGE:-}" ] || { echo "Thiếu NS hoặc IMAGE"; exit 1; }
            export KUBECONFIG="${KUBECONFIG:-/etc/rancher/k3s/k3s.yaml}"
            if command -v kubectl >/dev/null 2>&1; then K="kubectl"; else K="k3s kubectl"; fi

            if ! $K -n "$NS" get deploy "$DEPLOYMENT" >/dev/null 2>&1; then
              echo "Deployment $DEPLOYMENT chưa tồn tại trong namespace $NS."
              echo "Chạy scripts/apply.sh (repo viettel-vtk-deploy) trên server để tạo hạ tầng k8s lần đầu."
              exit 1
            fi

            prev="$($K -n "$NS" get deploy "$DEPLOYMENT" -o jsonpath='{.spec.template.spec.containers[0].image}')"
            echo "Đang chạy: $prev"
            echo "Bản mới : $IMAGE"

            if [ "$prev" = "$IMAGE" ]; then
              echo "Đã đúng bản này, không làm gì."
              exit 0
            fi

            $K -n "$NS" set image "deployment/$DEPLOYMENT" "$DEPLOYMENT=$IMAGE"
            if ! $K -n "$NS" rollout status "deployment/$DEPLOYMENT" --timeout=300s; then
              echo "Rollout thất bại, quay lại: $prev"
              $K -n "$NS" rollout undo "deployment/$DEPLOYMENT"
              $K -n "$NS" rollout status "deployment/$DEPLOYMENT" --timeout=180s || echo "Cảnh báo: chưa ổn định sau khi quay lại"
              exit 1
            fi
            echo "OK $DEPLOYMENT -> $IMAGE"
